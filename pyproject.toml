[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipewatch"
version = "0.1.0"
description = "Pipeline observability for legacy Slurm-based bioinformatics workflows"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Burak Bulut, Ph.D.", email = "burak.buluut@outlook.com" },
]
keywords = ["slurm", "hpc", "bioinformatics", "pipeline", "observability", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Unix Shell",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "jinja2>=3.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "types-python-dateutil",
]

[project.scripts]
pipewatch = "pipewatch.cli:main"
obsreport = "pipewatch.cli:obsreport_main"
obsrun = "pipewatch.obsrun:main"

[project.urls]
Homepage = "https://github.com/BurakBulut-sh/pipewatch"
Documentation = "https://github.com/BurakBulut-sh/pipewatch#readme"
Repository = "https://github.com/BurakBulut-sh/pipewatch"
Issues = "https://github.com/BurakBulut-sh/pipewatch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pipewatch"]

[tool.hatch.build.targets.wheel.force-include]
"src/pipewatch/obsrun.sh" = "pipewatch/obsrun.sh"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # Line length is handled by ruff format; template strings are long
    "TC",   # Type-checking import movements
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["TC", "ARG", "E712"]
"src/pipewatch/reporter/html_report.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=pipewatch --cov-report=term-missing --cov-report=html:htmlcov"

[tool.coverage.run]
source = ["src/pipewatch"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
